[package]
name = "fiducial-core"
# Internal crate version; the Python-facing version lives in pyproject.toml.
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "MIT"
description = "Rust fiducial ROC band kernel for the studroc_paper package"

[lib]
name = "fiducial_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py312"] }
numpy = "0.29"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented allow-list (kept short):
cast_precision_loss = "allow"      # usize/u64 -> f64 for grid fractions is intentional
cast_possible_truncation = "allow" # f64 -> f32 cloud storage and Lemire sampling truncate by design
inline_always = "allow"            # hot RNG path in the draw kernel
must_use_candidate = "allow"
missing_panics_doc = "allow"       # PyO3 entry point documents errors via PyResult
